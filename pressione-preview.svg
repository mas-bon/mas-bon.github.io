<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0d1b33"/>
      <stop offset="100%" stop-color="#071120"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132342" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1528" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#f43f5e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRose" cx="0.25" cy="0.6" r="0.45">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glowBlue)"/>
  <rect width="800" height="450" fill="url(#glowRose)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Left iPhone Mockup Card -->
  <g transform="translate(48, 38)">
    <rect x="0" y="0" width="230" height="374" rx="34" fill="#08101f" stroke="#2c4470" stroke-width="3"/>
    <rect x="10" y="10" width="210" height="354" rx="26" fill="url(#cardBg)" stroke="#1e325c" stroke-width="1"/>
    <!-- Dynamic Island -->
    <rect x="78" y="20" width="74" height="18" rx="9" fill="#030712"/>

    <!-- App Header inside Phone -->
    <rect x="24" y="52" width="32" height="32" rx="9" fill="#2563eb"/>
    <path d="M40 75 C40 75 31 69 31 63.5 C31 60.5 33.5 58.5 36 58.5 C38 58.5 39.5 59.8 40 61 C40.5 59.8 42 58.5 44 58.5 C46.5 58.5 49 60.5 49 63.5 C49 69 40 75 40 75 Z" fill="#ffffff"/>
    <text x="64" y="67" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800">Pressione</text>
    <text x="64" y="81" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="600">DIARIO CLINICO ESC/ESH</text>

    <!-- Metric Box in Phone -->
    <rect x="24" y="98" width="182" height="106" rx="16" fill="#0a1428" stroke="#1e3a6e" stroke-width="1.2"/>
    <text x="38" y="118" fill="#60a5fa" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.8">ULTIMA MISURAZIONE</text>
    <text x="38" y="158" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="900">118<tspan fill="#475569" font-size="24">/</tspan><tspan fill="#38bdf8">76</tspan></text>
    <text x="158" y="156" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">mmHg</text>

    <!-- Status Pill -->
    <rect x="38" y="172" width="76" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <circle cx="50" cy="182" r="3.5" fill="#34d399"/>
    <text x="59" y="185.5" fill="#6ee7b7" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700">Ottimale</text>

    <!-- Heart Rate Pill -->
    <text x="132" y="186" fill="#f43f5e" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="800">♥ 68 <tspan fill="#94a3b8" font-size="9" font-weight="600">bpm</tspan></text>

    <!-- Mini Trend Chart inside Phone -->
    <rect x="24" y="216" width="182" height="92" rx="14" fill="#0a1428" stroke="#1e2f52" stroke-width="1"/>
    <text x="36" y="234" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700">ANDAMENTO PRESSORIO</text>
    <polyline fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="36,272 68,260 100,266 132,252 164,258 192,248"/>
    <polyline fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="36,290 68,284 100,287 132,279 164,282 192,276"/>
    <circle cx="192" cy="248" r="4" fill="#60a5fa"/>
    <circle cx="192" cy="276" r="3.5" fill="#22d3ee"/>

    <!-- Bottom PDF / Export Bar -->
    <rect x="24" y="320" width="182" height="30" rx="10" fill="url(#accentBlue)"/>
    <text x="115" y="339" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="800">REPORT MEDICO PDF • EXCEL</text>
  </g>

  <!-- Right Hero Typography & Clinical ECG -->
  <g transform="translate(320, 76)">
    <!-- Badge -->
    <rect x="0" y="0" width="215" height="28" rx="14" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="28" y="18" fill="#93c5fd" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">PWA OFFLINE • iOS &amp; DESKTOP</text>

    <!-- Main Title -->
    <text x="0" y="76" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">DIARIO DELLA</text>
    <text x="0" y="124" fill="#38bdf8" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">PRESSIONE</text>

    <text x="0" y="158" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15.5" font-weight="500">
      Monitoraggio arterioso ESC/ESH, grafici clinici
    </text>
    <text x="0" y="180" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="15.5" font-weight="500">
      e Report Medico in PDF — 100% locale e privato.
    </text>

    <!-- ECG Waveform Card -->
    <rect x="0" y="206" width="432" height="96" rx="18" fill="#0b1528" fill-opacity="0.85" stroke="#1e3a6e" stroke-width="1.2"/>
    <path d="M 22 256 L 95 256 L 112 242 L 126 268 L 144 216 L 160 286 L 176 234 L 192 256 L 270 256 L 286 244 L 300 266 L 318 220 L 334 284 L 350 238 L 366 256 L 410 256" fill="none" stroke="url(#pulseLine)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="318" cy="220" r="5" fill="#f43f5e"/>
    <text x="26" y="232" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700">SYS / DIA / MAP / PP</text>
    <text x="320" y="232" fill="#f43f5e" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">100% PRIVATO</text>
  </g>
</svg>
